# Self-hosting Listick: Postgres and Listick (the migrations, the web app on :3000 and the background worker, in one container).
#   put this file and .env.example in a folder, cp .env.example .env (your TMDB token in it), then   docker compose up -d
#   updating:   docker compose pull && docker compose up -d
# To use a Postgres you already run (or a hosted one), drop the db service and depends_on, and set DATABASE_URL in .env.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: listick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-listick}
      POSTGRES_DB: listick
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "listick"]
      interval: 10s
      timeout: 5s
      retries: 5

  listick:
    image: ghcr.io/listicktv/listick:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://listick:${POSTGRES_PASSWORD:-listick}@db:5432/listick}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:?set TMDB_ACCESS_TOKEN in .env}
    ports:
      - "3000:3000"
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
